apiVersion: v1
kind: Namespace
metadata:
  name: mcp-servers
---
apiVersion: v1
kind: Secret
metadata:
  name: github-mcp-creds
  namespace: mcp-servers
type: Opaque
stringData:
  GITHUB_TOKEN: "<your-github-token>"
---
apiVersion: mcp.mcp-gateway.io/v1alpha1
kind: MCPServer
metadata:
  name: github-mcp
  namespace: mcp-servers
spec:
  image: ghcr.io/github/mcp-server:latest
  transport: streamable-http
  endpoint: /mcp
  port: 8080
  envFrom:
    - secretRef:
        name: github-mcp-creds
  scaling:
    minReplicas: 1
    maxReplicas: 5
  healthCheck:
    path: /health
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
