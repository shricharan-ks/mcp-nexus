apiVersion: v1
kind: Namespace
metadata:
  name: mcp-servers
---
apiVersion: v1
kind: Secret
metadata:
  name: github-mcp-creds
  namespace: mcp-servers
type: Opaque
stringData:
  GITHUB_TOKEN: "<your-github-token>"
---
apiVersion: mcp.mcp-gateway.io/v1alpha1
kind: MCPServer
metadata:
  name: github-mcp
  namespace: mcp-servers
spec:
  source:
    image: ghcr.io/github/mcp-server:latest
    port: 8080
    healthCheck:
      path: /health
      periodSeconds: 10
  protocol:
    transport: streamable-http
    endpoint: /mcp
  secrets:
    - envVar: GITHUB_TOKEN
      secretRef:
        name: github-mcp-creds
        key: GITHUB_TOKEN
  scaling:
    minReplicas: 1
    maxReplicas: 5
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
