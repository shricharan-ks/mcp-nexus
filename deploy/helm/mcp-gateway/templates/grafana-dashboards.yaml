{{- if .Values.observability.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mcp-gateway.fullname" . }}-grafana-dashboards
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mcp-gateway.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  platform-overview.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "id": 1,
          "title": "Servers Total",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
          "targets": [
            {
              "expr": "sum(mcpgateway_servers_total)",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "red", "value": 0}
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 2,
          "title": "Agents Total",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
          "targets": [
            {
              "expr": "sum(mcpgateway_agents_total)",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null}
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "title": "Request Rate",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
          "targets": [
            {
              "expr": "sum(rate(mcpgateway_requests_total[5m]))",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null}
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "title": "Error Rate %",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0},
          "targets": [
            {
              "expr": "(sum(rate(mcpgateway_requests_total{code=~\"5..\"}[5m])) / sum(rate(mcpgateway_requests_total[5m]))) * 100",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 1},
                  {"color": "red", "value": 5}
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 5,
          "title": "Request Rate by Server",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 16, "x": 0, "y": 4},
          "targets": [
            {
              "expr": "sum by (server) (rate(mcpgateway_requests_total[5m]))",
              "legendFormat": "{{ "{{" }}server{{ "}}" }}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "fillOpacity": 10
              }
            },
            "overrides": []
          }
        },
        {
          "id": 6,
          "title": "Servers by Phase",
          "type": "piechart",
          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 4},
          "targets": [
            {
              "expr": "sum by (phase) (mcpgateway_servers_total)",
              "legendFormat": "{{ "{{" }}phase{{ "}}" }}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          }
        }
      ],
      "schemaVersion": 39,
      "tags": ["mcp-gateway"],
      "templating": {"list": []},
      "time": {"from": "now-1h", "to": "now"},
      "title": "MCP Gateway - Platform Overview",
      "uid": "mcp-gateway-platform-overview"
    }
  per-server.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "id": 1,
          "title": "Latency Percentiles",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum by (le) (rate(mcpgateway_request_duration_seconds_bucket{server=\"$server\"}[5m])))",
              "legendFormat": "p50",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(mcpgateway_request_duration_seconds_bucket{server=\"$server\"}[5m])))",
              "legendFormat": "p95",
              "refId": "B"
            },
            {
              "expr": "histogram_quantile(0.99, sum by (le) (rate(mcpgateway_request_duration_seconds_bucket{server=\"$server\"}[5m])))",
              "legendFormat": "p99",
              "refId": "C"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "fillOpacity": 5
              }
            },
            "overrides": []
          }
        },
        {
          "id": 2,
          "title": "Tool Call Distribution",
          "type": "piechart",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [
            {
              "expr": "sum by (tool) (increase(mcpgateway_tool_calls_total{server=\"$server\"}[1h]))",
              "legendFormat": "{{ "{{" }}tool{{ "}}" }}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          }
        },
        {
          "id": 3,
          "title": "CPU Usage",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "targets": [
            {
              "expr": "rate(mcpgateway_server_cpu_seconds_total{server=\"$server\"}[5m])",
              "legendFormat": "CPU",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 15
              }
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "title": "Memory Usage",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "targets": [
            {
              "expr": "mcpgateway_server_memory_bytes{server=\"$server\"}",
              "legendFormat": "Memory",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 15
              }
            },
            "overrides": []
          }
        }
      ],
      "schemaVersion": 39,
      "tags": ["mcp-gateway"],
      "templating": {
        "list": [
          {
            "current": {},
            "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
            "definition": "label_values(mcpgateway_requests_total, server)",
            "name": "server",
            "label": "Server",
            "type": "query",
            "refresh": 2,
            "sort": 1
          }
        ]
      },
      "time": {"from": "now-1h", "to": "now"},
      "title": "MCP Gateway - Per Server",
      "uid": "mcp-gateway-per-server"
    }
  per-agent.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "id": 1,
          "title": "Tool Call Volume by Tool",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 0},
          "targets": [
            {
              "expr": "sum by (tool) (rate(mcpgateway_tool_calls_total{agent=\"$agent\"}[5m]))",
              "legendFormat": "{{ "{{" }}tool{{ "}}" }}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "fillOpacity": 10
              }
            },
            "overrides": []
          }
        },
        {
          "id": 2,
          "title": "Monthly Quota Usage",
          "type": "gauge",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "targets": [
            {
              "expr": "(mcpgateway_agent_quota_used{agent=\"$agent\"} / mcpgateway_agent_quota_limit{agent=\"$agent\"}) * 100",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 70},
                  {"color": "red", "value": 90}
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "title": "Denied Requests",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "targets": [
            {
              "expr": "sum(rate(mcpgateway_requests_denied_total{agent=\"$agent\"}[5m]))",
              "legendFormat": "Denied",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 15,
                "lineColor": "#F2495C"
              }
            },
            "overrides": []
          }
        }
      ],
      "schemaVersion": 39,
      "tags": ["mcp-gateway"],
      "templating": {
        "list": [
          {
            "current": {},
            "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
            "definition": "label_values(mcpgateway_tool_calls_total, agent)",
            "name": "agent",
            "label": "Agent",
            "type": "query",
            "refresh": 2,
            "sort": 1
          }
        ]
      },
      "time": {"from": "now-1h", "to": "now"},
      "title": "MCP Gateway - Per Agent",
      "uid": "mcp-gateway-per-agent"
    }
{{- end }}
