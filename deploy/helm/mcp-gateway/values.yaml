replicaCount: 1

image:
  repository: ghcr.io/mcp-gateway/mcp-gateway-operator
  tag: dev
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  annotations: {}
  name: ""

service:
  type: ClusterIP
  port: 8443
  healthPort: 8081
  metricsPort: 8080

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 64Mi

leaderElection:
  enabled: true

log:
  level: info
  format: json

securityContext:
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

gateway:
  enabled: true
  name: mcp-gateway
  namespace: ""  # defaults to release namespace
  className: mcp-gateway
  listeners:
    http:
      port: 80
    https:
      port: 443

auth:
  enabled: true
  issuer: "http://keycloak.mcp-system.svc.cluster.local:8080/realms/mcp-gateway"
  audience: "mcp-gateway"
  jwksUri: "http://keycloak.mcp-system.svc.cluster.local:8080/realms/mcp-gateway/protocol/openid-connect/certs"

rateLimit:
  enabled: true
  defaultRequestsPerMinute: 600

observability:
  enabled: true
  otelCollector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
  serviceMonitor:
    enabled: true
    interval: 15s
  alerts:
    enabled: true
