replicaCount: 1

image:
  repository: ghcr.io/mcp-gateway/mcp-gateway-operator
  tag: dev
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  annotations: {}
  name: ""

service:
  type: ClusterIP
  port: 8443
  healthPort: 8081
  metricsPort: 8080

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 64Mi

leaderElection:
  enabled: true

log:
  level: info
  format: json

securityContext:
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault
