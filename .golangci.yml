version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosimple
    - goconst
    - gofmt
    - goimports
    - misspell
    - unconvert
    - revive

linters-settings:
  goimports:
    local-prefixes: github.com/mcp-gateway/mcp-gateway
  revive:
    rules:
      - name: blank-imports
      - name: context-as-argument
      - name: dot-imports
      - name: error-return
      - name: error-strings
      - name: exported
      - name: increment-decrement
      - name: var-declaration
      - name: package-comments

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - unparam
