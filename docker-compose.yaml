services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: mcpgateway
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: mcpgateway
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcpgateway"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: bitnami/keycloak:26
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KEYCLOAK_DATABASE_HOST: postgres
      KEYCLOAK_DATABASE_NAME: keycloak
      KEYCLOAK_DATABASE_USER: mcpgateway
      KEYCLOAK_DATABASE_PASSWORD: devpassword
    depends_on:
      postgres:
        condition: service_healthy

  cerbos:
    image: ghcr.io/cerbos/cerbos:0.40.0
    ports:
      - "3592:3592"
      - "3593:3593"
    command: ["server", "--set=server.httpListenAddr=:3592", "--set=server.grpcListenAddr=:3593"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    volumes:
      - ./config/otel/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml

volumes:
  pgdata:
